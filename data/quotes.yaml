  translation: "因此，百战百胜，不算好中最好的；不通过交战就使敌人屈服，才是好中最好的。"
  source: "《孙子兵法·谋攻篇》"
  sport_application: "长期保持统治地位的运动员，依靠战术与心理优势提前瓦解对手抵抗力，很少需要拼到最后一刻才取胜。"
  faq_short:
