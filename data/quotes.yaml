  slug: "di-xing-you-tong-zhe-you-gua-zhe"
  quote_dimension: "物理极限"
  quote_sub_dimension: "战略"
  original: "孙子曰：地形有通者，有挂者，有支者，有隘者，有险者，有远者。凡此六者，地之道也；将之至任，不可不察也。"
  translation: "孙子说：地形有通、挂、支、隘、险、远六种类型。这六种地形，是用兵的客观法则；将领最重要的职责，就是必须清楚地理解它们。"
  source: "《孙子兵法·地形篇》"
  sport_application: "在陌生场地进行比赛时，开局阶段的试探性回合应重点收集球速、弹跳高度、风向及场地摩擦系数等信息。"
  faq_short:
    - q: "在陌生场地进行比赛时，开局阶段的试探性回合应重点收集哪些场地信息？"
      a: "开局阶段应重点收集球速、弹跳高度、风向及场地摩擦系数等信息。"
  draft: false
  date: 2026-09-12

