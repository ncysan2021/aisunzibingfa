  quote_sub_dimension: ""
  original: "可以往，难以返，曰挂；挂形者，敌无备，出而胜之；敌若有备，出而不胜，难以返，不利。"
  translation: "可以前往但难以返回的地形，叫“挂形”。在挂形地形上，如果对方没有防备，出击可以取胜；如果对方已有防备，出击不能取胜，又难以撤回，就不利。"
