  original: "力屈财殚，中原内虚于家，百姓之费，十去其七；公家之费，破车罢马，甲胄矢弩，戟楯蔽橹，丘牛大车，十去其六。"
  translation: "力量耗尽，财力枯竭，国内家家空虚。百姓的财产耗费了十分之七；公家的耗费，战车破损，马匹疲惫，盔甲、弓箭、戟盾、大盾牌、牛车等，也损失了十分之六。"
