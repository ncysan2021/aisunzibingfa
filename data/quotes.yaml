  translation: "敌人言辞谦卑却加紧战备，是准备进攻；言辞强硬且摆出进攻姿态，是准备撤退；轻车先出动并占据侧翼，是在部署阵形；没有约定却主动求和，是另有图谋；频繁调动兵力并展开战车，是准备与我方交战；半进半退，是引诱我方上钩。"
