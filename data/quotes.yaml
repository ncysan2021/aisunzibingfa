  chapter: "作战篇"
  chapter_order: 2
  order: 1
  slug: "fan-yong-bing-zhi-fa-chi-che-qian-si"
  quote_dimension: "资源约束"
  quote_sub_dimension: ""
  original: "孙子曰：凡用兵之法，驰车千驷，革车千乘，带甲十万，千里馈粮。"
  translation: "孙子说：一般用兵的规律是，要出动轻快战车一千辆、重型战车一千辆、穿戴盔甲的士兵十万人，还要从千里之外运送粮食。"
  source: "《孙子兵法·作战篇》"
  sport_application: "训练营开始前，装备、场地、恢复手段的准备不足，往往比训练本身更容易导致计划失败。"
  faq_short:
    - q: "为什么训练营开始前，装备、场地、恢复手段的准备不足，往往比训练本身更容易导致计划失败？"
      a: "资源准备不足会中断训练，恢复缺失累积疲劳导致失败。"
  draft: false
  date: 2026-09-12

- id: "zuo-zhan-002"
