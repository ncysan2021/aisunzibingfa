  chapter: "作战篇"
  chapter_order: 2
  order: 2
  slug: "ze-nei-wai-zhi-fei-bin-ke-zhi-yong"
  quote_dimension: "资源约束"
  quote_sub_dimension: ""
  original: "则内外之费，宾客之用，胶漆之材，车甲之奉，日费千金，然后十万之师举矣。"
  translation: "那么国内外的各种费用，招待宾客使节的用度，胶漆等器材的消耗，战车和盔甲的保养补充，每天要耗费巨额资金，然后十万人的军队才能出动。"
  source: "《孙子兵法·作战篇》"
  sport_application: "一支职业车队在赛季开始前的装备采购和后勤预算，往往超过很多人对“训练成本”的认知。"
  faq_short:
    - q: "为什么一支职业车队在赛季开始前的装备采购和后勤预算，往往超过很多人对“训练成本”的认知？"
      a: "装备采购与后勤支出含维护及人员保障，远超训练费用。"
  draft: false
  date: 2026-09-12

- id: "zuo-zhan-003"
  chapter_slug: "chapter-02-zuo-zhan"
  chapter: "作战篇"
  chapter_order: 2
  order: 3
  slug: "qi-yong-zhan-ye-sheng-jiu-ze-dun-bing"
  quote_dimension: "资源约束"
  quote_sub_dimension: ""
  original: "其用战也胜，久则钝兵挫锐，攻城则力屈，久暴师则国用不足。"
  translation: "用兵作战，贵在速胜，如果拖延太久，军队就会疲惫，锐气受挫，攻城会使力量耗尽，长期在外作战会使国家财政困难。"
  source: "《孙子兵法·作战篇》"
  sport_application: "在长距离比赛中，前期过度消耗体能（如马拉松前半程过快）会导致后程配速严重下降甚至退赛。"
  faq_short:
    - q: "为什么在长距离比赛中，前期过度消耗体能（如马拉松前半程过快）会导致后程配速严重下降甚至退赛？"
      a: "前期过快消耗糖原，后程能量不足导致掉速或退赛。"
  draft: false
  date: 2026-09-12

