  slug: "guo-zhi-pin-yu-shi-zhe-yuan-shu"
  quote_dimension: "资源约束"
  quote_sub_dimension: ""
  original: "国之贫于师者远输，远输则百姓贫；近于师者贵卖，贵卖则百姓财竭，财竭则急于丘役。"
  translation: "国家因为用兵而变得贫穷，远途运输是重要原因；远途运输就会使百姓贫困。靠近军队驻扎的地方物价会上涨，物价上涨就会使百姓财富枯竭，财富枯竭就急于增加赋税徭役。"
  source: "《孙子兵法·作战篇》"
  sport_application: "参加远离常住地的赛事，交通与住宿成本会成为影响业余运动员参赛频率的关键因素。"
  faq_short:
    - q: "为什么参加远离常住地的赛事，交通与住宿成本会成为影响业余运动员参赛频率的关键因素？"
      a: "远途参赛的交通住宿成本侵占训练恢复资源，制约频率。"
  draft: false
  date: 2026-09-12

