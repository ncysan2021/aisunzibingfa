  faq:
  - q: 为什么顶尖教练的战术手册无法完全复制给另一支球队并取得同样效果？
    a: 结论：战术依赖球队特质与临场判断，无法照搬。同一套战术在不同选手的身体条件、技术风格与心理特质下会产生完全不同的执行效果，且对手的临场反应也会改变战术的生效条件。
  - q: 「不可先传」是否意味着赛前不需要制定战术？
    a: 结论：并非如此，赛前必须制定战术框架，但框架只提供原则与方向。真正决定胜负的是选手在场上根据实时信息做出的调整，赛前方案的作用是减少混乱而非替代判断。
  - q: 在短道速滑这类高速对抗项目中，临场决策为什么比预设战术更重要？
    a: 结论：因为对手位置与速度每秒都在变化。短道速滑的超越时机取决于前方选手的路线选择与体力分配，任何赛前写定的超越点都会被对手的临场调整打破，选手必须实时读取赛道信息。
  - q: 如何训练选手的临场决策能力而非只练固定套路？
    a: 结论：在训练中系统引入不确定性。通过随机改变对手强度、比分情境与场地条件，逼迫选手在非预设条件下做出判断，并把复盘重点放在决策逻辑而非动作序列上。
