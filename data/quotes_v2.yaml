  faq:
  - q: 教练在制定队内规则时，应如何区分「官道」与「主用」以避免执行混乱？
    a: 结论：明确职责分工与物资保障边界，避免重叠与遗漏。教练须将岗位职责与物资调用权限分列成表，指定专人负责，并每周核对，确保人、岗、物各归其位。
  - q: 资源有限的小型运动队如何落实「曲制」？
    a: 结论：以最小可行编制覆盖核心职能。优先保证主教练、体能、医疗三个岗位，其余职能可外聘或共享，避免编制虚设导致资源分散。
  - q: 短道速滑等冬季项目中，「主用」最容易出现哪些资源约束？
    a: 结论：冰刀、防切割服与冰场时段是最紧缺资源。须提前锁定冰场训练时段，建立冰刀维护与备用制度，并确保防切割服每人合身且通过安全认证。
  - q: 如何判断队内「法」的制度设计是否有效？
    a: 结论：看比赛与训练中是否出现因职责不清或物资短缺导致的失误。若频繁出现换人混乱、器材故障、补给断档，说明制度约束未落实，须立即复盘调整。
