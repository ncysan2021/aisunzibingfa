  faq:
  - q: 「闻」与「知」在竞技训练中有什么区别？
    a: 结论：「闻」是听过战术讲解，「知」是在压力下能正确调用并调整战术。训练重点应放在后者，用情境模拟检验理解深度。
  - q: 短道速滑中如何体现「知之者胜」？
    a: 结论：短道速滑的胜负常取决于对对手路线、体能分配与判罚尺度的理解。只背战术而不会临场调整的选手，容易在最后一圈被超越或犯规。
  - q: 冰壶这类冷门项目为什么特别依赖「知」？
    a: 结论：冰壶节奏慢、决策多，冰面变化与对手布局需要持续解读。教练若只讲原则而不做情境模拟，队员在关键局往往无法判断该守还是该搏。
  - q: 如何判断队员是否真正「知」？
    a: 结论：让队员在随机情境中限时做出选择并说明依据，若选择与依据一致且可复盘，才算真正理解。
