- title: 《孙子兵法》作战篇：驰车千驷与竞技资源约束——奥运备战的先胜之道
  description: 从《孙子兵法·作战篇》「驰车千驷，革车千乘，带甲十万，千里馈粮」出发，解析体育竞技中的资源约束维度：装备、场地、后勤与恢复如何决定训练成败，并给出短道速滑、铁人三项等奥运项目的落地行动清单。
