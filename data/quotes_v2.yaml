  howto:
  - name: 列出七计对照表
    text: 把主孰有道、将孰有能、天地孰得、法令孰行、兵众孰强、士卒孰练、赏罚孰明七项写成两列，左侧填己方，右侧填对手。
  - name: 逐项打分
    text: 每项按1至5分打分，分数依据近期比赛数据、训练记录与录像分析，避免凭印象给分。
  - name: 计算分差并排序
    text: 把七项分差从大到小排列，分差最大的落后项就是备战资源最该倾斜的方向。
  - name: 设定守正与出奇
    text: 分差为正且稳定的项目作为「正」，保持常规打法；分差为负的项目作为「奇」，设计针对性战术。
  - name: 赛后复盘更新
    text: 比赛结束后用实际结果回填七计打分，检验哪几项判断准确、哪几项出现偏差，形成下一轮备战的修正依据。
  itemlist:
  - name: 主孰有道
    description: 团队目标是否统一、队员是否认同集体方向，对应队伍凝聚力与心理稳定性。
  - name: 将孰有能
    description: 教练组的临场指挥、战术设计与调整能力，对应关键局的决策质量。
  - name: 天地孰得
    description: 对场地、冰面、气候、赛道与赛程时段的适应程度，对应环境变量掌控力。
  - name: 法令孰行
    description: 队伍纪律与规则执行的严格程度，对应比赛中是否因犯规或失误被罚。
  - name: 兵众孰强
    description: 装备、器材、科研保障与体能储备水平，对应硬件与体能基础。
  - name: 士卒孰练
    description: 运动员技术熟练度与训练质量，对应动作稳定性与临场发挥。
  - name: 赏罚孰明
    description: 队内激励与问责机制是否清晰公正，对应运动员的投入意愿与抗压动力。
  faq:
  - q: 七计对比法在赛前准备中到底解决什么问题？
    a: 结论：七计对比法解决的是「把赛前判断从直觉变成可验证清单」的问题，通过逐项打分找出己方与对手差距最大的环节，让备战资源集中投放，而不是平均用力。
  - q: 七项中如果多项落后，是否意味着比赛没有胜算？
    a: 结论：多项落后不等于没有胜算，而是提示必须用「出奇」策略，把资源集中在分差最大的一到两项上做针对性突破，同时用占优项目守住基本盘，避免全面对抗。
  - q: 短道速滑这类对抗性项目如何应用七计？
    a: 结论：短道速滑可重点对比「天地孰得」与「法令孰行」，前者看冰面适应与道次分配，后者看犯规控制与裁判尺度适应，这两项往往比单纯速度更能决定名次。
  - q: 七计打分会不会因为主观而失真？
    a: 结论：打分失真的根源是缺少数据支撑，应尽量用近期比赛成绩、训练监测数据与录像统计作为打分依据，并在赛后用实际结果回填校验，逐步校准评分标准。
