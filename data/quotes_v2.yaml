  tldr:
  - 「校之以计，而索其情」的核心是把赛前判断从直觉变成可打分的七项对比清单。
  - 七问覆盖团队向心力、教练能力、环境适应、规则执行、装备水平、训练质量与激励机制，每一项都能在赛前量化。
  - 七计不是用来预测必胜，而是用来发现己方最弱一环，把备战资源集中到差距最大的项目上。
  direct_answer: 校之以计而索其情，指赛前用七项对比逐条打分，把双方实力差距量化，再据此判断胜负概率并调整备战重点。
