  defined_terms:
  - term: 道
    description: 团队共识与目标认同，在体育中体现为全队对战术目标的一致承诺。
  - term: 天
    description: 外部时机与赛程条件，包括比赛时段、气候、赛季节奏等不可控但可预判的因素。
  - term: 地
