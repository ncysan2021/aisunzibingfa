  - term: 信息纵深
    description: 参赛方掌握的赛前情报在时间跨度、颗粒度与覆盖面上的综合深度，决定战术方案的针对性与备选方案的丰富度。
  - term: 临场调整空间
    description: 比赛中根据实时情况改变战术、节奏或技术动作的余地，其大小由赛前准备的方案储备量决定。
  - term: 方案储备
    description: 针对不同对手、不同赛道条件、不同赛程阶段预先设计的多套战术预案，是战略考察的最终产出。
  howto:
  - name: 锁定考察对象
    text: 明确本场赛事的关键变量：场地类型、赛程密度、主要对手、裁判判罚倾向，列出清单逐项核实。
  - name: 建立信息纵深
    text: 对每个变量收集至少三个时间维度的信息：赛前数月的历史数据、赛前数周的近期状态、赛前数日的现场条件。
  - name: 转化为方案储备
    text: 将信息研判结果转化为至少两套可执行的战术预案，明确每套方案的触发条件与切换信号。
  - name: 模拟压力测试
    text: 在训练中模拟预案切换场景，检验运动员在疲劳与压力下能否准确执行调整指令。
  - name: 赛后复盘归档
    text: 将实际比赛中的信息偏差与调整效果记录归档，作为下一场赛事战略考察的起点。
