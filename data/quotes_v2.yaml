  - q: 资源约束下，守正与出奇应如何取舍？
    a: 结论：守正是底线，出奇是增量，先用守正配置确保不提前出局，再在地形缝隙中择机出奇，两者按局面动态切换。
  - q: 短道速滑与冰壶如何体现「远近、险易、广狭、死生」？
    a: 结论：短道速滑以弯道远近与内道死生区决定超越时机，冰壶以冰面宽窄与传击风险决定守正或出奇，两者都依赖地形量化。
  - q: 如何避免把资源约束误读为保守退让？
    a: 结论：资源约束是精确分配有限体能、时间与空间，而非放弃进攻，出奇窗口正是把节省的资源集中投向地形缝隙。
