  defined_terms:
  - term: 资源约束
    description: 在体育竞技中，指运动员无法改变的外部条件，如气候、海拔、赛道等，只能在其限制下优化决策。
  - term: 有氧效率
    description: 身体在氧气参与下产生能量的效率，高温高湿环境下会显著下降，导致同等配速下心率与耗氧更高。
  - term: 配速策略
    description: 运动员在比赛中对速度的分配方案，需根据气候、赛道、对手等因素动态调整。
  - term: 热适应
    description: 通过反复暴露于高温环境，使身体产生血浆容量增加、出汗率提升等生理适应，以减轻热应激。
  howto:
  - name: 赛前评估气候条件
    text: 查阅比赛日温度、湿度、风速与海拔，计算体感温度与热指数，判断对配速的潜在影响。
  - name: 设定保守配速区间
    text: 根据热指数调整目标配速，通常高温高湿下每公里配速应比常温慢5-15秒。
  - name: 制定分段补给方案
    text: 在高温环境下增加补水与电解质摄入频率，每15-20分钟补充一次，避免脱水。
  - name: 进行热适应训练
    text: 赛前7-14天在相似气候下进行适应性训练，逐步增加暴露时间，提升耐热能力。
  - name: 赛中动态调整
    text: 根据心率、体感与出汗量实时微调配速，若出现头晕、恶心等热应激症状立即降速或退赛。
  itemlist:
  - name: 热指数计算
    description: 结合温度与湿度计算体感温度，作为配速调整的量化依据。
  - name: 配速对照表
    description: 建立不同热指数下的目标配速区间，便于赛前快速查阅。
  - name: 补给检查清单
    description: 列出高温环境下所需的补水、电解质、降温物品，确保赛前准备充分。
  - name: 热适应训练计划
    description: 赛前7-14天的渐进式热暴露训练安排，提升生理耐热能力。
  - name: 退赛决策标准
    description: 明确出现热射病前兆时的退赛条件，保障运动员安全。
  faq:
  - q: 高温高湿环境下，长距离耐力项目的配速策略为什么需要比常温环境更保守？
    a: 结论：高温高湿致有氧效率下降，须降低配速以维持体能分配。
  - q: 冬季项目如短道速滑，冰面温度如何影响比赛策略？
    a: 结论：冰面温度影响摩擦力与冰质，选手需调整蹬冰力度与弯道技术。
  - q: 高原环境下，耐力项目应如何调整配速？
    a: 结论：高原氧气稀薄，有氧能力下降，配速应比平原慢，并提前进行高原适应。
  - q: 如何判断是否因气候条件而退赛？
    a: 结论：出现头晕、恶心、寒战等热应激或失温症状时，应立即退赛以保安全。
