- title: 将听吾计，用之必胜：战术纪律高于个人天赋的竞技铁律
  description: 从《孙子兵法·始计篇》出发，解析竞技体育中战术执行与个人天赋的博弈。以短道速滑、冰壶、篮球、赛艇等奥运项目为例，探讨教练如何判断谁该留、谁该去，建立可落地的团队纪律决策框架。
