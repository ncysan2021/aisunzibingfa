  defined_terms:
  - term: 资源约束
    description: 在竞技备战中，装备、场地、后勤补给与恢复手段的总量有限，任何训练计划都必须在此边界内设计。
  - term: 千里馈粮
    description: 原指从远方运送军粮，在体育语境中映射为跨地域参赛时的后勤补给与器材运输链条。
  - term: 恢复窗口
    description: 运动员在高强度训练后，身体机能回到可再次承受负荷状态所需的时间段，属于稀缺资源。
  - term: 先胜后战
    description: 《孙子兵法》核心观念之一，指在行动前先通过资源盘点与条件计算，形成可胜之势再投入比赛。
  howto:
  - name: 盘点装备与器材库存
    text: 在训练营开始前，逐项清点冰刀、护具、自行车、划艇等器材数量与损耗状态，标注可替换与不可替换项，形成一张资源清单。
  - name: 核算场地与时段配额
    text: 统计可用冰面、泳道、赛道与力量房时段，按训练优先级分配，避免多组队员争抢同一资源导致训练中断。
  - name: 建立后勤补给链
    text: 针对跨城或跨省集训，提前确认运输、住宿、餐饮与医疗点位，设置至少一条备用补给路线。
  - name: 锁定恢复资源
    text: 把理疗、冰浴、睡眠监测与营养补剂纳入资源表，按周排期，确保恢复窗口不被训练挤占。
  - name: 设置资源预警线
    text: 为每类关键资源设定最低库存或最低可用时段，一旦触及预警线立即调整训练负荷或启动补充方案。
  itemlist:
  - name: 装备清单
    description: 逐项列出训练与比赛所需器材，标注数量、状态与替换周期。
  - name: 场地时段表
    description: 按天与时段记录可用训练场地，标出高峰冲突点。
  - name: 后勤路线图
    description: 标明运输、住宿、餐饮与医疗点位，并设置备用路线。
  - name: 恢复资源表
    description: 列出理疗、冰浴、睡眠与营养资源，按周排期。
  - name: 资源预警线
    description: 为关键资源设定最低库存或最低可用时段，触发即调整。
  faq:
  - q: 《孙子兵法·作战篇》的「驰车千驷，革车千乘」在体育竞技中对应什么？
    a: 结论：对应竞技备战中的装备与器材总量盘点，教练须先算清可用资源再安排训练强度。
  - q: 为什么资源约束维度对奥运项目备战特别重要？
    a: 结论：奥运周期长、器材与场地成本高，资源缺口会在关键训练节点放大为计划中断。
  - q: 短道速滑队如何用资源约束思路避免训练失败？
    a: 结论：优先锁定冰面时段与备用冰刀，并把恢复窗口写入周计划，防止器材或恢复缺口打断训练。
  - q: 铁人三项选手在跨地域参赛时最该先盘点哪类资源？
    a: 结论：先盘点自行车运输、补给品与医疗点位，再安排赛前训练，避免后勤断链影响比赛状态。
  related: []
  sections:
    section1: '## 古文解析：驰车千驷背后的资源账本


      【原文事实】《孙子兵法·作战篇》开篇即列出一组庞大数字：「凡用兵之法，驰车千驷，革车千乘，带甲十万，千里馈粮。」轻快战车千辆、重型战车千辆、甲士十万，还要从千里之外运粮。


      【传统解释】曹操注此句重在「先计」二字，认为出兵之前必须把车、甲、粮三项资源算清；杜牧则强调「千里馈粮」意味着消耗巨大，粮道一旦中断，前线即溃。历代注家共同指向一个判断：资源总量决定行动边界。


      【作者分析】孙子把装备、兵员、粮道并列，说明资源约束不是单一项目，而是一条链。链条中最脆弱的一环往往不是前线，而是千里之外的补给。竞技备战同理：冰刀、场地、恢复手段若有一项断供，训练计划就会从内部瓦解。


      【现代应用】短道速滑队在赛季前先盘点冰面时段、备用冰刀与理疗排期；铁人三项选手在跨城参赛前先确认自行车运输与补给品清单。资源账本先立，训练强度才有意义。'
    section2: '## 跨学科映射：资源约束如何进入竞技系统


      在竞技体育中，<dfn title="在竞技备战中，装备、场地、后勤补给与恢复手段的总量有限，任何训练计划都必须在此边界内设计。">资源约束</dfn>是一个可量化的系统变量。运动训练学把它拆成装备存量、场地时段、后勤链条与<dfn title="运动员在高强度训练后，身体机能回到可再次承受负荷状态所需的时间段，属于稀缺资源。">恢复窗口</dfn>四类。


      「千里馈粮」在体育语境中映射为跨地域参赛的后勤链：器材运输、营养补给、医疗点位。链条越长，不确定性越高，因此需要设置冗余。


      这与<dfn title="《孙子兵法》核心观念之一，指在行动前先通过资源盘点与条件计算，形成可胜之势再投入比赛。">先胜后战</dfn>同构：先让资源条件成立，再让训练与比赛发生。冰壶队赛前反复核对冰面时段与备用石壶，正是把资源约束转成可执行清单。'
    section3: '## 决策矩阵：资源约束下的守正与出奇


      {{< table caption="竞技备战中资源约束维度的守正与出奇对照" >}}

      | 应用场景 | 守「正」基础 | 出「奇」策略 | ⚠️ 风险与底线 |

      | --- | --- | --- | --- |

      | 短道速滑赛季前装备盘点 | 逐项清点冰刀、护具与备用件 | 把备用冰刀提前运抵赛区 | 备用件不足会直接导致退赛 |

      | 铁人三项跨城参赛后勤 | 确认自行车运输与补给清单 | 设置两条独立补给路线 | 补给断链会使比赛状态崩盘 |

      | 冰壶集训场地分配 | 按优先级锁定冰面时段 | 用非高峰时段做专项打磨 | 时段冲突会挤掉关键训练 |

      | 游泳高原训练恢复 | 把理疗与睡眠纳入周计划 | 用低负荷日集中做恢复 | 恢复窗口被挤占会累积疲劳 |

      | 田径冬训器材保障 | 盘点钉鞋、起跑器与测速设备 | 提前测试备用器材 | 器材故障会打断技术训练 |

      {{< /table >}}'
    section4: '## 避坑指南：资源缺口如何击穿计划


      反例一：某短道速滑队在赛季初集训时，只带了两副备用冰刀，且未提前确认赛区冰面维护时段。一次训练中主力冰刀断裂，备用件规格不匹配，队伍被迫取消三天冰上训练，技术节奏被打乱。


      反例二：某铁人三项选手跨省参赛，自行车运输延误，补给品未设第二路线，赛前两天无法完成骑行适应，比赛日状态明显下滑。


      避坑要点：第一，关键器材必须按「一用一备」配置；第二，后勤链条必须设置独立备用路线；第三，恢复资源要写进周计划，不能被训练临时挤占；第四，为每类关键资源设定预警线，触及即调整负荷。'
    section5: '## 落地行动：把资源约束变成可执行清单


      1. 盘点装备与器材库存，逐项标注数量、状态与替换周期。

      2. 核算场地与时段配额，按训练优先级分配，标出冲突点。

      3. 建立后勤补给链，确认运输、住宿、餐饮与医疗点位，并设置备用路线。

      4. 锁定恢复资源，把理疗、冰浴、睡眠监测与营养补剂纳入周排期。

      5. 为每类关键资源设定最低库存或最低可用时段，触及预警线立即调整训练负荷。

      6. 在训练营开始前完成一次全链条演练，验证资源清单是否可执行。'
