  - name: 对手状态追踪
    description: 主要对手近期比赛数据、技术动作变化、体能分配习惯的持续追踪记录。
  - name: 赛程密度分析
    description: 预赛、半决赛、决赛之间的间隔时间与体能恢复窗口的精确计算。
  - name: 裁判尺度研判
    description: 当值裁判在同类赛事中的判罚倾向与尺度松紧的历史数据整理。
  - name: 预案切换清单
    description: 不同比赛情境下对应战术方案的触发条件与执行要点的简明清单。
  faq:
  - q: 为什么说赛前信息收集深度会直接影响奥运选手的战术选择？
    a: 结论：信息深度决定战术方案的针对性与临场调整空间，赛前考察越充分，可切换的预案越多，临场应对越从容。
  - q: 在短道速滑这类高速对抗项目中，战略考察具体考察什么？
    a: 结论：重点考察冰面状态、对手起跑与超越习惯、赛程轮次间的体能分配窗口，以及裁判对接触判罚的尺度。
  - q: 花样滑冰这类以技术评分为主的项目，战略考察是否同样重要？
    a: 结论：同样重要，需考察裁判组构成、技术分与节目内容分的评分倾向、同组对手的出场顺序与赛季最佳成绩。
  - q: 击剑项目中，赛前战略考察如何转化为临场优势？
    a: 结论：通过研究对手的进攻节奏与习惯性防守动作，预先设定开局试探方案与中局变招方案，压缩临场决策时间。
