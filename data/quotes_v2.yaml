  - q: 五德中哪一项对短道速滑选手最重要？
    a: 结论：智与勇的组合最关键，短道速滑的超越时机与路线选择依赖智，关键圈的果断超越依赖勇，二者缺一即难成核心。
  - q: 冰壶项目中「信」为什么被特别强调？
    a: 结论：冰壶是高度依赖团队沟通与信任的项目，投壶决策需要队友扫冰配合，信不足会直接导致战术执行断裂。
  - q: 如果一名运动员智勇突出但严不足，还能培养为核心吗？
