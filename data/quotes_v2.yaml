  - term: 守正
    description: 以基础配置、标准动作与安全底线应对赛场常规局面，确保不因冒险而提前出局。
  - term: 出奇
    description: 在地形缝隙或对手惯性中制造非对称优势，以非常规节奏、线路或技术打破均势。
  - term: 死生之地
    description: 赛场上风险与收益极端的区域，如短道弯道内道、马拉松陡坡、击剑端线，进入需精确计算。
  - term: 地形量化
    description: 把距离、坡度、宽窄、危险区转化为可比较的数据，用于赛前战术推演与资源分配。
  howto:
  - name: 赛前勘察四维记录
    text: 按「远近、险易、广狭、死生」四项记录赛道距离、坡度变化、可用宽度与危险区域，形成一页地形卡。
  - name: 体能资源分段绑定
    text: 把全程距离切分为若干段，每段绑定目标配速、心率区间与补给点，避免在险易段过度消耗。
  - name: 守正配置先行
    text: 先确定基础战术与安全底线，例如短道速滑前段守内道、马拉松上坡降步频，确保不因冒进失误。
  - name: 出奇窗口标记
    text: 在地形卡上标出两到三个出奇窗口，如弯道出口、对手换气点、端线附近，明确触发条件与执行动作。
  - name: 死生区域红线
    text: 为每个死生区域设定不可逾越的红线，如冰壶不冒险传击、击剑不盲目压上，一旦越线立即回守。
  - name: 赛后复盘更新地形卡
    text: 记录实际执行与地形卡偏差，更新距离、坡度与危险区数据，供下一次资源约束决策使用。
