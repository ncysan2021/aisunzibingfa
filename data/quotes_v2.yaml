  - term: 不可先传
    description: 出自《孙子兵法·始计篇》，指取胜的战术诀窍无法在战前以固定形式完整传授，必须结合临场条件生成。
  - term: 战术预制
    description: 把战术写成可复制、可照搬的固定方案，忽略执行者特质与对手反应差异的做法。
  - term: 临场决策
    description: 在比赛进行中依据实时信息调整战术的行为，是「不可先传」在竞技中的核心体现。
  - term: 战术适配度
    description: 一套战术与特定选手身体条件、技术风格、心理特质的匹配程度，决定战术能否生效。
  howto:
  - name: 第一步：拆解战术的骨架与血肉
    text: 把一套成熟战术拆成「结构原则」与「临场变量」两层。结构原则可传授，临场变量必须由选手在场上自行判断。
  - name: 第二步：评估选手特质匹配度
    text: 对照选手的身体条件、技术风格与心理特征，判断哪些战术环节能直接移植，哪些必须重写。
  - name: 第三步：设计多套应变分支
    text: 为同一战术目标准备至少三套应变分支，覆盖领先、落后、僵持三种局面，避免单一路径被对手预判。
  - name: 第四步：在训练中制造不确定性
    text: 训练时随机改变对手强度、场地条件与比分情境，逼迫选手在非预设条件下做出判断，而非背诵流程。
  - name: 第五步：赛后复盘只提炼原则
    text: 复盘时提炼可迁移的决策原则，而非记录具体动作序列，防止把一次成功经验固化成下一场的教条。
