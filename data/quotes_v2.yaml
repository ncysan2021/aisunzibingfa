  howto:
  - name: 定义五事指标
    text: 为道、天、地、将、法各设定两到三个可观测指标，例如道可看战术会议出席率与目标认同度。
  - name: 设定权重
    text: 根据项目特点分配权重，短道速滑可提高地与将的权重，击剑可提高将与法的权重。
  - name: 收集对手数据
    text: 通过录像、公开成绩与场地报告，为对手在相同指标上打分。
  - name: 计算比较
    text: 将双方各维度得分乘以权重后求和，得出情势对比分数。
  - name: 制定应对策略
    text: 针对落后维度设计针对性训练或战术调整，领先维度则巩固优势。
  - name: 赛后复盘
    text: 用实际比赛结果校验评分模型，修正指标与权重，形成可迭代的赛前准备流程。
