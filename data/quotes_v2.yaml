- title: 凡此五者，将莫不闻，知之者胜，不知者不胜——从「听过」到「真懂」的竞技认知转化
  description: 《孙子兵法·始计篇》「凡此五者，将莫不闻，知之者胜，不知者不胜」讲的是认知深度决定胜负。本文从战略维度拆解「闻」与「知」的差距，映射到短道速滑、冰壶等奥运项目的战术训练，给出情境模拟、决策矩阵与落地行动清单。
