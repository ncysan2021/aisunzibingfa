  translation: 所以用计算比较的方法来探求胜负的情势，要问：哪一方的君主更得人心？哪一方的将领更有才能？哪一方更能掌握天时地利？哪一方的法令更能贯彻执行？哪一方的武器装备更精良？哪一方的士兵更训练有素？哪一方的赏罚更公正严明？我根据这些就能判断谁胜谁负了。
  source: 《孙子兵法·始计篇》
