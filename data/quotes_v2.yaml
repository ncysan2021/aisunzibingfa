  - term: 索其情
    description: 探求胜负的真实情势，即通过对比数据还原比赛可能走向的客观依据。
  - term: 七计
    description: 主孰有道、将孰有能、天地孰得、法令孰行、兵众孰强、士卒孰练、赏罚孰明七项对比标准。
  - term: 决策矩阵
