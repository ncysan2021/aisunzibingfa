outputs:
  home:
    - HTML
    - RSS
    - JSON

baseURL: "https://aisunzibingfa.com/"
title: "AI孙子兵法"
languageCode: "zh-hans"
defaultContentLanguage: "zh-hans"
buildFuture: true

theme: ["PaperMod"]

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

pagination:
  pagerSize: 20

params:
  env: production
  description: "AI孙子兵法收录《孙子兵法》十三篇全部经典语录，从体育竞技、商业管理与人生决策视角深度解读。每条语录附原文、白话翻译、FAQ 常见问答与竞技应用示范，帮助读者在比赛、职场与人生博弈中活用兵法智慧。"
  author: "吴雄山"
  defaultTheme: "auto"
  ShowReadingTime: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  # R2 图片基础 URL
  imageBaseURL: "https://pub-f9d6c3356fb44ce0b1e0f09cb4ddf49a.r2.dev"
 
  # Google AdSense（审核通过后再开）
  adsense:
    enabled: false
    client: "ca-pub-XXXXXXXXXXXXXXXX"
    slots:
      top: "1234567890"
      bottom: "0987654321"

  # 页头 Logo
  label:
    text: "AI孙子兵法"
    icon: "/aisunzibingfa-logo-512.png"
    iconHeight: 35

  # Favicon 全套
  assets:
    favicon: "/aisunzibingfa-favicon.ico"
    favicon16x16: "/aisunzibingfa-favicon-16x16.png"
    favicon32x32: "/aisunzibingfa-favicon-32x32.png"
    apple_touch_icon: "/aisunzibingfa-apple-touch-icon.png"

  homeInfoParams:
    Title: "AI孙子兵法"
    Content: "从竞技视角读经典。十三篇语录，每条附原文、翻译、FAQ 与竞技应用。"

  socialIcons:
    - name: facebook
      url: "https://www.facebook.com/aisunzibingfa"
    - name: instagram
      url: "https://www.instagram.com/aisunzibingfa"

menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 1
    - identifier: about
      name: 关于我们
      url: /about/
      weight: 5
    - identifier: quotes
      name: 经典语录
      url: /quotes/
      weight: 10
    - identifier: founders
      name: 朋友创业圈
      url: /founders/
      weight: 20
    - identifier: exam
      name: 考试局
      url: /exam/
      weight: 30
    - identifier: blueprint
      name: 企业蓝图
      url: /blueprint/
      weight: 40
    - identifier: brand-story
      name: 品牌故事
      url: /brand-story/
      weight: 50
    - identifier: contact
      name: 联系我们
      url: /contact/
      weight: 60
    - identifier: privacy
      name: 隐私政策
      url: /privacy/
      weight: 70

related:
  threshold: 80
  includeNewer: true
  indices:
    - name: keywords
      weight: 100
    - name: tags
      weight: 80
    - name: chapter_slug
      weight: 60

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

ignoreFiles:
  - '\.bak-.*'
  - 'content-backup/.*'
