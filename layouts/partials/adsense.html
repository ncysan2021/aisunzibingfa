{{- /* AdSense 广告位组件（MQS-2.0）
      未启用时输出空字符串，不报错 */ -}}
{{- if site.Params.adsense.enabled -}}
  {{- $client := site.Params.adsense.client -}}
  {{- $slot := .slot -}}
  {{- $slotId := index site.Params.adsense.slots $slot -}}
  {{- if and $client $slotId -}}
    <div class="adsense-wrapper adsense-{{ $slot }}" style="margin: 24px 0; text-align: center; min-height: 100px;">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="{{ $client }}"
           data-ad-slot="{{ $slotId }}"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  {{- end -}}
{{- end -}}
