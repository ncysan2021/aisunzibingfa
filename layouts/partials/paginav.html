{{- /* 上一篇 / 下一篇导航（MQS-2.0）
      基于 Hugo 默认 PrevInSection / NextInSection 逻辑 */ -}}
{{- $prev := .PrevInSection -}}
{{- $next := .NextInSection -}}
{{- if or $prev $next }}
<nav class="paginav">
  {{- with $prev }}
    <a class="prev" href="{{ .Permalink }}">
      <span class="title">« 上一篇</span>
      <span>{{ .Title }}</span>
    </a>
  {{- end }}
  {{- with $next }}
    <a class="next" href="{{ .Permalink }}">
      <span class="title">下一篇 »</span>
      <span>{{ .Title }}</span>
    </a>
  {{- end }}
</nav>
{{- end }}
